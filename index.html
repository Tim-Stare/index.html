<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Plains Wiki</title>
<link rel="icon" type="image/png" href="Retro-Plains-HTML.png">
<style>
:root {
  /* Light mode */
  --bg-image: url('Stud.png');
  --topbar-bg: #024FA2;
  --topbar-text: #ffffff;
  --sidebar-bg: #ffffff;
  --sidebar-text: #000000;
  --sidebar-border: #024FA2;
  --sidebar-btn-bg: #f8f8f8;
  --sidebar-btn-hover: #e0e0e0;
  --content-text: #222222;
  --footer-bg: #024FA2;
  --footer-text: #ffffff;
  --button-bg: #024FA2;
  --button-text: #ffffff;
  --about-outer: #024FA2;
  --about-inner: #ffffff;
  --about-text: #222222;
  --about-heading: #024FA2;
  --rect-bg: #024FA2;
  --popup-bg: rgba(2,79,162,0.92);
  --popup-text: #ffffff;
  --music-popup-bg: #ffffff;
  --music-popup-border: #024FA2;
  --music-btn-bg: #024FA2;
  --overlay-bg: rgba(0,0,0,0.2);
}

body.dark {
  /* Dark mode - mörkblått + mörkgrått */
  --topbar-bg: #0a1628;
  --topbar-text: #d0d8e0;
  --sidebar-bg: #121c2b;
  --sidebar-text: #d0d8e0;
  --sidebar-border: #2a3f5f;
  --sidebar-btn-bg: #121c2b;
  --sidebar-btn-hover: #1e2d45;
  --content-text: #d0d8e0;
  --footer-bg: #0a1628;
  --footer-text: #d0d8e0;
  --button-bg: #1e3a5f;
  --button-text: #ffffff;
  --about-outer: #0f1c2e;
  --about-inner: #152238;
  --about-text: #d0d8e0;
  --about-heading: #7a9cc5;
  --rect-bg: #152238;
  --popup-bg: rgba(10, 22, 40, 0.96);
  --popup-text: #d0d8e0;
  --music-popup-bg: #121c2b;
  --music-popup-border: #2a3f5f;
  --music-btn-bg: #1e3a5f;
  --overlay-bg: rgba(0,0,0,0.55);
}

html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg-image) no-repeat center center;
  background-size: cover;
  overflow-x: hidden;
  color: var(--content-text);
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Top Bar */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background-color: var(--topbar-bg);
  color: var(--topbar-text);
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
}
.left-section { display: flex; align-items: center; }
.left-section img { height: 42px; margin-right: 10px; }
.tab-toggle {
  background: none;
  border: none;
  color: var(--topbar-text);
  font-size: 26px;
  cursor: pointer;
  margin-right: 12px;
}
.clock { font-size: 15px; }

/* Dark mode toggle */
.theme-toggle {
  background: none;
  border: 2px solid var(--topbar-text);
  color: var(--topbar-text);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  margin-left: 12px;
}
.theme-toggle:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.12);
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 55px;
  left: 0;
  width: 250px;
  bottom: 60px;
  background-color: var(--sidebar-bg);
  border-right: 2px solid var(--sidebar-border);
  transform: translateX(-100%);
  transition: transform 0.3s ease, background-color 0.3s ease;
  overflow-y: auto;
  z-index: 100;
  box-shadow: 2px 0 8px rgba(0,0,0,0.35);
}
.sidebar.active { transform: translateX(0); }
.sidebar button {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 0;
  border: none;
  background-color: var(--sidebar-btn-bg);
  color: var(--sidebar-text);
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  border-left: 5px solid transparent;
  transition: all 0.2s ease;
  cursor: pointer;
}
.sidebar button:hover {
  background-color: var(--sidebar-btn-hover);
  border-left-color: var(--sidebar-border);
}
.sidebar button.active {
  background-color: var(--sidebar-btn-hover);
  border-left-color: var(--sidebar-border);
  font-weight: bold;
}

/* Overlay */
.overlay {
  position: fixed;
  top: 55px;
  left: 0;
  right: 0;
  bottom: 60px;
  background: var(--overlay-bg);
  z-index: 90;
  display: none;
}
.overlay.active { display: block; }

/* Content */
.content {
  padding: 20px 20px 80px 20px;
  text-align: center;
  overflow: hidden;
}
.content img:first-child {
  max-width: 100%;
  border-radius: 12px;
}

/* Footer */
.footer {
  background-color: var(--footer-bg);
  color: var(--footer-text);
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  font-size: 16px;
  flex-direction: column;
  transition: background-color 0.3s ease;
}

/* Rectangles */
.rect-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
.rectangle {
  position: relative;
  background-color: var(--rect-bg);
  color: white;
  width: 300px;
  height: 200px;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: transform 0.25s ease, background-color 0.3s ease;
}
.rectangle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 12px;
}
.rectangle .text-container { display: none; }
.rectangle:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}
.rectangle.under-construction {
  background: url('Stud.png') no-repeat center center;
  background-size: cover;
  position: relative;
}
.rectangle.under-construction::after {
  content: "UNDER CONSTRUCTION";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-20deg);
  background: yellow;
  color: black;
  font-weight: bold;
  padding: 5px 10px;
  border: 2px solid black;
}

/* Smaller images for creators & special people */
.rectangle img.small-img {
  width: 60%;
  height: 60%;
  object-fit: contain;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 12px;
}
.rectangle img.medium-img {
  width: 75%;
  height: 75%;
  object-fit: contain;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 12px;
}

/* Buttons */
.button, .roblox-button {
  display: block;
  width: 300px;
  max-width: 90%;
  margin: 10px auto;
  padding: 15px 20px;
  background-color: var(--button-bg);
  color: var(--button-text);
  border: none;
  border-radius: 12px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.button:hover, .roblox-button:hover {
  transform: translateY(-2px);
}

/* Retro Railways */
.content h2.retro-railways {
  color: white;
  text-shadow: -2px -2px 0 red, 2px -2px 0 red, -2px 2px 0 red, 2px 2px 0 red;
  font-size: 28px;
}

/* ===== ABOUT TEXT CONTAINER ===== */
.about-container {
  max-width: 850px;
  margin: 30px auto;
  background-color: var(--about-outer);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  transition: background-color 0.3s ease;
}

.about-inner {
  background-color: var(--about-inner);
  border-radius: 12px;
  padding: 28px 32px;
  color: var(--about-text);
  font-size: 17px;
  line-height: 1.7;
  text-align: left;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.about-inner h2 {
  margin-top: 0;
  margin-bottom: 18px;
  color: var(--about-heading);
  text-align: center;
  font-size: 26px;
}

.about-inner p {
  margin: 0 0 16px 0;
}

/* Music Player */
#music-player-container {
  position: fixed;
  bottom: 0;
  right: 20px;
  z-index: 200;
}
#music-button {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}
#music-button img {
  width: 50px;
  height: 50px;
  transition: transform 0.1s ease;
}
#music-button:active img { transform: scale(0.85); }
#music-popup {
  position: fixed;
  bottom: 70px;
  right: -350px;
  width: 300px;
  background: var(--music-popup-bg);
  border: 2px solid var(--music-popup-border);
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  padding: 10px;
  text-align: center;
  transition: right 0.3s ease, background-color 0.3s ease;
  z-index: 200;
  color: var(--content-text);
}
#music-popup.active { right: 20px; }
#radio-header img {
  width: 100%;
  border-radius: 8px;
}
#music-controls {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 10px;
}
#music-controls button {
  background: var(--music-btn-bg);
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s ease;
}
#music-controls button:hover { transform: scale(1.1); }
#loop-song.active { background: #0366d6; }
#current-song {
  font-weight: bold;
  margin-top: 8px;
}

/* Location popup */
.location-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.location-popup.active { display: flex; }
.popup-box {
  width: 85%;
  max-width: 950px;
  background: var(--popup-bg);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  gap: 20px;
  position: relative;
  box-shadow: 0 18px 40px rgba(0,0,0,0.6);
  transform-origin: center center;
  color: var(--popup-text);
  transition: background-color 0.3s ease;
}
@keyframes popupIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes popupOut {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.96); }
}
.location-popup.active .popup-box {
  animation: popupIn 260ms cubic-bezier(.2,.9,.2,1) forwards;
}
.location-popup.closing .popup-box {
  animation: popupOut 180ms cubic-bezier(.4,.0,.2,1) forwards;
}
.popup-left {
  width: 50%;
  text-align: center;
}
.popup-left img {
  width: 100%;
  border-radius: 10px;
  display: block;
}

/* Vit bakgrund för personbilder (creators / special) */
.popup-left img.person-img {
  background: #ffffff;
  padding: 12px;
  object-fit: contain;
  max-height: 380px;
}

.popup-title {
  color: var(--popup-text);
  font-weight: bold;
  margin-top: 10px;
  font-size: 20px;
}
.popup-right {
  width: 50%;
  color: var(--popup-text);
  text-align: left;
  line-height: 1.45;
}
.popup-right h3 { margin-top: 0; }
.popup-close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: var(--popup-text);
  font-size: 24px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="left-section">
    <button class="tab-toggle" onclick="toggleSidebar()">☰</button>
    <img src="Roblox-Logo.png" alt="Roblox Logo">
    <img src="Retro-Plains-Logo-2.png" alt="Retro Plains Logo">
  </div>
  <div style="display: flex; align-items: center;">
    <div class="clock" id="clock"></div>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">🌙</button>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="showContent('home')">Home</button>
  <button onclick="showContent('about')">About Retro Plains</button>
  <button onclick="showContent('locations')">Locations of Retro Plains</button>
  <button onclick="showContent('railways')">Retro Railways</button>
  <button onclick="showContent('creators')">Creators</button>
  <button onclick="showContent('special')">Special People</button>
</div>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="content" id="content">
  <img src="Retro-Plains-Wiki.png" alt="Welcome">
  <br>
  <a href="index.html" class="button">Back to Home</a>
  <a href="https://www.roblox.com/games/125897335112047/W-I-P-The-Town-of-Retro-Plains" target="_blank" class="roblox-button">Play Retro Plains on Roblox</a>
</div>

<div class="footer">
  <span>© 2025 Retro Plains Wiki – Made by Tragedy (@fisnisse09)</span>
  <span id="last-updated">Last Updated: </span>
</div>

<div id="music-player-container">
  <button id="music-button"><img src="Roblox-Logo-Blue.png" alt="Music Player"></button>
  <div id="music-popup">
    <div id="radio-header"><img src="Retro-Plains-Radio-Player.png" alt="Radio Player"></div>
    <audio id="radio-audio" controls></audio>
    <div id="current-song">Now Playing: </div>
    <div id="music-controls">
      <button id="prev-song">Prev</button>
      <button id="play-pause">Play</button>
      <button id="next-song">Next</button>
      <button id="loop-song">Loop</button>
    </div>
  </div>
</div>

<div class="location-popup" id="locationPopup" onclick="closePopup(event)">
  <div class="popup-box" id="popupBox">
    <div class="popup-close" onclick="closePopup()">✖</div>
    <div class="popup-left">
      <img id="popupImage" alt="">
      <div class="popup-title" id="popupTitle"></div>
    </div>
    <div class="popup-right">
      <h3>Lore</h3>
      <p id="popupLore"></p>
      <h3>Built By</h3>
      <p id="popupBuiltBy"></p>
    </div>
  </div>
</div>

<script>
// ========== DARK MODE ==========
const themeToggle = document.getElementById('themeToggle');
const body = document.body;

if (localStorage.getItem('theme') === 'dark') {
  body.classList.add('dark');
  themeToggle.textContent = '☀️';
}

themeToggle.addEventListener('click', () => {
  body.classList.toggle('dark');
  if (body.classList.contains('dark')) {
    themeToggle.textContent = '☀️';
    localStorage.setItem('theme', 'dark');
  } else {
    themeToggle.textContent = '🌙';
    localStorage.setItem('theme', 'light');
  }
});

// ========== CLOCK ==========
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
}
setInterval(updateClock, 1000);
updateClock();

// ========== SIDEBAR ==========
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
  document.querySelector(".tab-toggle").textContent =
    document.getElementById("sidebar").classList.contains("active") ? "✖" : "☰";
}

// ========== LAST UPDATED ==========
document.getElementById('last-updated').textContent = 'Last Updated: ' + document.lastModified;

// ========== POPUP ==========
const locationPopup = document.getElementById('locationPopup');
const popupBox = document.getElementById('popupBox');
const popupImage = document.getElementById('popupImage');
const popupTitle = document.getElementById('popupTitle');
const popupLore = document.getElementById('popupLore');
const popupBuiltBy = document.getElementById('popupBuiltBy');
let closeTimer = null;

function openLocation(img, title, lore, builtBy = "fisnisse09", isPerson = false) {
  clearTimeout(closeTimer);
  locationPopup.classList.remove('closing');
  popupImage.src = img;
  popupImage.alt = title;
  popupTitle.textContent = title;
  popupLore.textContent = lore;
  popupBuiltBy.textContent = builtBy;

  // Vit bakgrund bara för personer (creators / special)
  if (isPerson) {
    popupImage.classList.add('person-img');
  } else {
    popupImage.classList.remove('person-img');
  }

  locationPopup.classList.add('active');
}

function closePopup(e) {
  if (!e || e.target === locationPopup) {
    locationPopup.classList.add('closing');
    closeTimer = setTimeout(() => {
      locationPopup.classList.remove('active');
      locationPopup.classList.remove('closing');
    }, 200);
  }
}
popupBox.addEventListener('click', e => e.stopPropagation());

// ========== MUSIC PLAYER ==========
const songs = [
  { title: "Jeff Syndicate", src: "Jeff Syndicate.mp3" },
  { title: "Happy Day of Robloxia", src: "Happy Day of Robloxia.mp3" },
  { title: "Wind of Fjords", src: "Wind of Fjords.mp3" },
  { title: "The Great Strategy", src: "Roblox Main Theme.mp3" },
  { title: "Cursed Abbey", src: "Cursed Abbey.mp3" },
  { title: "Halo Theme", src: "HALO.mp3" }
];

let currentSongIndex = 0;
const radioAudio = document.getElementById('radio-audio');
const currentSongText = document.getElementById('current-song');
const playPauseBtn = document.getElementById('play-pause');
const loopBtn = document.getElementById('loop-song');
const prevBtn = document.getElementById('prev-song');
const nextBtn = document.getElementById('next-song');
const musicButton = document.getElementById('music-button');
const musicPopup = document.getElementById('music-popup');
let isPlaying = false;

function loadSong(index) {
  radioAudio.src = songs[index].src;
  currentSongText.textContent = "Now Playing: " + songs[index].title;
}

function togglePlayPause() {
  if (isPlaying) {
    radioAudio.pause();
    isPlaying = false;
    playPauseBtn.textContent = "Play";
  } else {
    radioAudio.play();
    isPlaying = true;
    playPauseBtn.textContent = "Pause";
  }
}

function playNextSong() {
  currentSongIndex = (currentSongIndex + 1) % songs.length;
  loadSong(currentSongIndex);
  if (isPlaying) radioAudio.play();
}

function playPrevSong() {
  currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
  loadSong(currentSongIndex);
  if (isPlaying) radioAudio.play();
}

function toggleLoop() {
  loopBtn.classList.toggle('active');
  radioAudio.loop = !radioAudio.loop;
}

radioAudio.addEventListener('ended', () => {
  if (!radioAudio.loop) {
    playNextSong();
  }
});

musicButton.onclick = () => musicPopup.classList.toggle('active');
playPauseBtn.onclick = togglePlayPause;
nextBtn.onclick = playNextSong;
prevBtn.onclick = playPrevSong;
loopBtn.onclick = toggleLoop;

loadSong(currentSongIndex);

// ========== TAB CONTENT ==========
function showContent(tab) {
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.querySelector(".tab-toggle").textContent = "☰";

  const content = document.getElementById('content');
  content.innerHTML = "";

  if (tab === "home") {
    content.innerHTML = `
      <img src="Retro-Plains-Wiki.png" alt="Welcome"><br>
      <a href="index.html" class="button">Back to Home</a>
      <a href="https://www.roblox.com/games/125897335112047/W-I-P-The-Town-of-Retro-Plains" target="_blank" class="roblox-button">Play Retro Plains on Roblox</a>
    `;
  } else if (tab === "about") {
    content.innerHTML = `
      <div class="about-container">
        <div class="about-inner">
          <h2>About Retro Plains</h2>
          <p>Retro Plains is a charming classic Robloxian valley nestled between blocky hills and timeless terrain, completely untouched by modern noise. Inspired by the purest classic Robloxian roots, it is a peaceful township where simplicity meets pixelated serenity.</p>
          
          <p>Cobblestone paths wind gently between cozy houses, tall oak trees, and sturdy pines, guided by the soft glow of neon-lit lampposts. Beyond the town lies the Bloxian Archipelago, home to the mighty Bloxium Fortress that still holds the proud history of their strength and victories in the great Naval Warfares. Be sure to visit Retroium Castle, once the seat of power of the former king of Retro Plains, Bloxius the IV.</p>
          
          <p>Stop by the Retro Plains Farm, lovingly run by the Bloxian Family. Here they grow golden wheat, sweet corn, crisp carrots, and much more — keeping the stomachs of everyone in town happily full.</p>
          
          <p>When you’re ready to travel farther, hop aboard the Retro Railway High Speed Train System. Ride the rails to Snowy Bloxlands, Neonblox Central, or even Ambergrove, all thanks to the skilled train driver Lellesnygg.</p>
          
          <p>This town may be small, but its heart is big and growing every second — lovingly built by fisnisse09 and RobloxArvid.</p>
        </div>
      </div>
    `;
  } else if (tab === "locations") {
    content.innerHTML = `
      <h2>Locations of Retro Plains</h2>
      <div class="rect-container">
        <div class="rectangle" onclick="openLocation('Retro Plains Centre.png','Retro Plains Centre','The bustling centre of Retro Plains, filled with cozy stalls, shops, and friendly Robloxians.','fisnisse09')">
          <img src="Retro Plains Centre.png">
        </div>
        <div class="rectangle" onclick="openLocation('Retro Plains Hospital.png','Retro Plains Hospital','Where residents receive care and attention. Known for its helpful staff.','fisnisse09')">
          <img src="Retro Plains Hospital.png">
        </div>
        <div class="rectangle" onclick="openLocation('Retro Plains Farm.png','Retro Plains Farm','Scenic farmland tended by the Bloxian Family that feeds the Population of Retro Plains.','fisnisse09')">
          <img src="Retro Plains Farm.png">
        </div>
        <div class="rectangle" onclick="openLocation('Grandma and Grandpas House.png','Grandma & Grandpas House','Filled with stories, memories, and laughter.','fisnisse09')">
          <img src="Grandma and Grandpas House.png">
        </div>
        <div class="rectangle" onclick="openLocation('Mayors Cabin.png','Mayors Cabin','Where town decisions are made, ensuring charm and peace.','fisnisse09')">
          <img src="Mayors Cabin.png">
        </div>
        <div class="rectangle" onclick="openLocation('Retroium Castle.png','Retroium Castle','Historic castle of Bloxius IV.','fisnisse09')">
          <img src="Retroium Castle.png">
        </div>
        <div class="rectangle" onclick="openLocation('Retro Plains Police Station.png','Retro Plains Police Station','Hub of safety and order.','fisnisse09')">
          <img src="Retro Plains Police Station.png">
        </div>
        <div class="rectangle" onclick="openLocation('MONTYLOKS Luxury Cabin.png','MONTYLOKS Luxury Cabin','Private retreat with luxurious interiors.','fisnisse09')">
          <img src="MONTYLOKS Luxury Cabin.png">
