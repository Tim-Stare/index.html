<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Plains Wiki</title>
<link rel="icon" type="image/png" href="Roblox-Logo.png">
<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('Stud.png') no-repeat center center;
  background-size: cover;
  overflow-x: hidden;
}

/* Top Bar */
.top-bar { position: sticky; top: 0; z-index: 20; background-color: #024FA2; color: white; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
.left-section { display: flex; align-items: center; }
.left-section img { height: 42px; margin-right: 10px; }
.tab-toggle { background: none; border: none; color: white; font-size: 26px; cursor: pointer; margin-right: 12px; }
.clock { font-size: 15px; }

/* Sidebar */
.sidebar { position: fixed; top: 55px; left: 0; width: 250px; bottom: 60px; background-color: #fff; border-right: 2px solid #024FA2; transform: translateX(-100%); transition: transform 0.3s ease; overflow-y: auto; z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,0.3); }
.sidebar.active { transform: translateX(0); }
.sidebar button { display: block; width: 100%; padding: 12px; margin: 0; border: none; background-color: #f8f8f8; color: #000; font-size: 16px; font-weight: 600; text-align: left; border-left: 5px solid transparent; transition: all 0.2s ease; cursor: pointer; }
.sidebar button:hover { background-color: #e0e0e0; border-left-color: #024FA2; }
.sidebar button.active { background-color: #ddd; border-left-color: #024FA2; font-weight: bold; }

/* Overlay */
.overlay { position: fixed; top: 55px; left: 0; right: 0; bottom: 60px; background: rgba(0,0,0,0.2); z-index: 90; display: none; }
.overlay.active { display: block; }

/* Content */
.content { padding: 20px 20px 80px 20px; text-align: center; overflow: hidden; }
.content img:first-child { max-width: 100%; border-radius: 12px; }

/* Footer */
.footer { background-color: #024FA2; color: white; height: 60px; display: flex; align-items: center; justify-content: center; position: fixed; bottom: 0; left: 0; right: 0; font-size: 16px; flex-direction: column; }

/* Rectangles */
.rect-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
.rectangle { position: relative; background-color: #024FA2; color: white; width: 300px; height: 200px; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.25s ease; }
.rectangle img { width: 100%; height: 100%; object-fit: cover; object-position: center; position: absolute; top: 0; left: 0; border-radius: 12px; }
.rectangle .text-container { display: none; } 
.rectangle:hover { transform: scale(1.02); box-shadow: 0 8px 18px rgba(0,0,0,0.25); }
.rectangle.under-construction { background: url('Stud.png') no-repeat center center; background-size: cover; position: relative; }
.rectangle.under-construction::after { content: "UNDER CONSTRUCTION"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg); background: yellow; color: black; font-weight: bold; padding: 5px 10px; border: 2px solid black; }

/* Smaller webp images for creators & special people */
.rectangle img.small-img {
  width: 60%;
  height: 60%;
  object-fit: contain;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 12px;
}

/* Buttons */
.button, .roblox-button { display: block; width: 300px; max-width: 90%; margin: 10px auto; padding: 15px 20px; background-color: #024FA2; color: white; border: none; border-radius: 12px; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; transition: all 0.2s ease; }
.button:hover, .roblox-button:hover { transform: translateY(-2px); }

/* Retro Railways */
.content h2.retro-railways { color: white; text-shadow: -2px -2px 0 red,2px -2px 0 red,-2px 2px 0 red,2px 2px 0 red; font-size: 28px; }

/* Music Player */
#music-player-container { position: fixed; bottom: 0; right: 20px; z-index: 200; }
#music-button { background: none; border: none; cursor: pointer; padding: 0; }
#music-button img { width: 50px; height: 50px; transition: transform 0.1s ease; }
#music-button:active img { transform: scale(0.85); }
#music-popup { position: fixed; bottom: 70px; right: -350px; width: 300px; background: #fff; border: 2px solid #024FA2; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding: 10px; text-align: center; transition: right 0.3s ease; z-index: 200; }
#music-popup.active { right: 20px; }
#radio-header img { width: 100%; border-radius: 8px; }
#music-controls { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
#music-controls button { background: #024FA2; border: none; border-radius: 8px; padding: 8px 12px; color: white; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
#music-controls button:hover { transform: scale(1.1); }
#loop-song.active { background: #0366d6; }
#current-song { font-weight: bold; margin-top: 8px; }

/* Location popup */
.location-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 999; }
.location-popup.active { display: flex; }
.popup-box { width: 85%; max-width: 950px; background: rgba(2,79,162,0.92); border-radius: 14px; padding: 20px; display: flex; gap: 20px; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,0.6); transform-origin: center center; }
@keyframes popupIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes popupOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
.location-popup.active .popup-box { animation: popupIn 260ms cubic-bezier(.2,.9,.2,1) forwards; }
.location-popup.closing .popup-box { animation: popupOut 180ms cubic-bezier(.4,.0,.2,1) forwards; }
.popup-left { width: 50%; text-align: center; }
.popup-left img { width: 100%; border-radius: 10px; display: block; }
.popup-title { color: white; font-weight: bold; margin-top: 10px; font-size: 20px; }
.popup-right { width: 50%; color: white; text-align: left; line-height: 1.45; }
.popup-right h3 { margin-top: 0; }
.popup-close { position: absolute; top: 10px; right: 15px; color: white; font-size: 24px; cursor: pointer; }

</style>
</head>
<body>

<div class="top-bar">
  <div class="left-section">
    <button class="tab-toggle" onclick="toggleSidebar()">☰</button>
    <img src="Roblox-Logo.png" alt="Roblox Logo">
    <img src="Retro-Plains-Logo-2.png" alt="Retro Plains Logo">
  </div>
  <div class="clock" id="clock"></div>
</div>

<div class="sidebar" id="sidebar">
  <button onclick="showContent('home')">Home</button>
  <button onclick="showContent('about')">About Retro Plains</button>
  <button onclick="showContent('locations')">Locations of Retro Plains</button>
  <button onclick="showContent('railways')">Retro Railways</button>
  <button onclick="showContent('creators')">Creators</button>
  <button onclick="showContent('special')">Special People</button>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="content" id="content">
  <img src="Retro-Plains-Wiki.png" alt="Welcome">
  <br>
  <a href="index.html" class="button">Back to Home</a>
  <a href="https://www.roblox.com/games/125897335112047/W-I-P-The-Town-of-Retro-Plains" target="_blank" class="roblox-button">Play Retro Plains on Roblox</a>
</div>

<div class="footer">
  <span>© 2025 Retro Plains Wiki – Made by Tragedy (@fisnisse09)</span>
  <span id="last-updated">Last Updated: </span>
</div>

<div id="music-player-container">
  <button id="music-button"><img src="Roblox-Logo-Blue.png" alt="Music Player"></button>
  <div id="music-popup">
    <div id="radio-header"><img src="Retro-Plains-Radio-Player.png" alt="Radio Player"></div>
    <audio id="radio-audio" controls></audio>
    <div id="current-song">Now Playing: </div>
    <div id="music-controls">
      <button id="prev-song">Prev</button>
      <button id="play-pause">Play</button>
      <button id="next-song">Next</button>
      <button id="loop-song">Loop</button>
    </div>
  </div>
</div>

<div class="location-popup" id="locationPopup" onclick="closePopup(event)">
  <div class="popup-box" id="popupBox">
    <div class="popup-close" onclick="closePopup()">✖</div>
    <div class="popup-left">
      <img id="popupImage" alt="">
      <div class="popup-title" id="popupTitle"></div>
    </div>
    <div class="popup-right">
      <h3>Lore</h3>
      <p id="popupLore"></p>
      <h3>Built By</h3>
      <p>fisnisse09</p>
    </div>
  </div>
</div>

<script>
// Clock
function updateClock(){const now=new Date(); document.getElementById("clock").textContent=now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});}
setInterval(updateClock,1000); updateClock();

// Sidebar toggle
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); document.querySelector(".tab-toggle").textContent=document.getElementById("sidebar").classList.contains("active")?"✖":"☰";}

// Last updated
document.getElementById('last-updated').textContent = 'Last Updated: '+document.lastModified;

// Popup handlers
const locationPopup = document.getElementById('locationPopup');
const popupBox = document.getElementById('popupBox');
const popupImage = document.getElementById('popupImage');
const popupTitle = document.getElementById('popupTitle');
const popupLore = document.getElementById('popupLore');
let closeTimer = null;

function openLocation(img, title, lore){
  clearTimeout(closeTimer);
  locationPopup.classList.remove('closing');
  popupImage.src = img;
  popupImage.alt = title;
  popupTitle.textContent = title;
  popupLore.textContent = lore;
  locationPopup.classList.add('active');
}

function closePopup(e){
  if(!e || e.target===locationPopup){
    locationPopup.classList.add('closing');
    closeTimer = setTimeout(()=>{ locationPopup.classList.remove('active'); locationPopup.classList.remove('closing'); },200);
  }
}
popupBox.addEventListener('click',e=>e.stopPropagation());

// Music player
const songs = [
    { title: "HALO", src: "HALO.mp3" },
    { title: "Jeff Syndicate", src: "Jeff Syndicate.mp3" },
    { title: "Happy Day of Robloxia", src: "Happy Day of Robloxia.mp3" },
    { title: "Wind of Fjords", src: "Wind of Fjords.mp3" },
    { title: "The Great Strategy", src: "Roblox Main Theme.mp3" },
    { title: "Cursed Abbey", src: "Cursed Abbey.mp3" },
    { title: "Halo Theme", src: "HALO.mp3" }
];
let currentSongIndex = 0;
const radioAudio = document.getElementById('radio-audio');
const currentSongText = document.getElementById('current-song');
const playPauseBtn = document.getElementById('play-pause');
const loopBtn = document.getElementById('loop-song');
const prevBtn = document.getElementById('prev-song');
const nextBtn = document.getElementById('next-song');
const musicButton = document.getElementById('music-button');
const musicPopup = document.getElementById('music-popup');
let isPlaying = false;

function loadSong(index){
    radioAudio.src = songs[index].src;
    currentSongText.textContent = "Now Playing: " + songs[index].title;
}

function togglePlayPause(){
    if(isPlaying){
        radioAudio.pause(); 
        isPlaying=false; 
        playPauseBtn.textContent="Play";
    } else {
        radioAudio.play(); 
        isPlaying=true; 
        playPauseBtn.textContent="Pause";
    }
}

function playNextSong(){
    currentSongIndex=(currentSongIndex+1)%songs.length;
    loadSong(currentSongIndex);
    if(isPlaying) radioAudio.play();
}

function playPrevSong(){
    currentSongIndex=(currentSongIndex-1+songs.length)%songs.length;
    loadSong(currentSongIndex);
    if(isPlaying) radioAudio.play();
}

function toggleLoop(){
    loopBtn.classList.toggle('active');
    radioAudio.loop=!radioAudio.loop;
}

musicButton.onclick = ()=>musicPopup.classList.toggle('active');
playPauseBtn.onclick = togglePlayPause;
nextBtn.onclick = playNextSong;
prevBtn.onclick = playPrevSong;
loopBtn.onclick = toggleLoop;

loadSong(currentSongIndex);

// Tab content
function showContent(tab){
    const content=document.getElementById('content');
    content.innerHTML=""; 
    if(tab==="home"){
        content.innerHTML='<img src="Retro-Plains-Wiki.png" alt="Welcome"><br><a href="index.html" class="button">Back to Home</a><a href="https://www.roblox.com/games/125897335112047/W-I-P-The-Town-of-Retro-Plains" target="_blank" class="roblox-button">Play Retro Plains on Roblox</a>';
    } else if(tab==="about"){
        content.innerHTML="<h2>About Retro Plains</h2><p>Retro Plains is a classic Roblox-inspired town filled with cozy areas, creative builds, and iconic places for players to explore. Created by fisnisse09, the town combines nostalgia and fun.</p>";
    } else if(tab==="locations"){
        content.innerHTML="<h2>Locations of Retro Plains</h2><div class='rect-container'>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Centre.png','Retro Plains Centre','The bustling heart of Retro Plains, filled with cozy cafes, shops, and friendly Robloxians.')\"><img src='Retro Plains Centre.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Hospital.png','Retro Plains Hospital','Where residents receive care and attention. Known for its helpful staff.')\"><img src='Retro Plains Hospital.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Farm.png','Retro Plains Farm','Scenic farmland tended by the Bloxian Family.')\"><img src='Retro Plains Farm.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Grandma and Grandpas house.png','Grandma & Grandpa\'s House','Filled with stories, memories, and laughter.')\"><img src='Grandma and Grandpas house.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Mayors Cabin.png','Mayor\'s Cabin','Where town decisions are made, ensuring charm and peace.')\"><img src='Mayors Cabin.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retroium Castle.png','Retroium Castle','Historic castle of Bloxius IV.')\"><img src='Retroium Castle.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Police Station.png','Retro Plains Police Station','Hub of safety and order.')\"><img src='Retro Plains Police Station.png'></div>\
        <div class='rectangle' onclick=\"openLocation('MONTYLOKS Luxury Cabin.png','MONTYLOKS Luxury Cabin','Private retreat with luxurious interiors.')\"><img src='MONTYLOKS Luxury Cabin.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Coastal City.png','Rarö','Coastal city with beautiful beaches and a busy port.')\"><img src='Retro Plains Coastal City.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Metro.png','Retro Plains Metro','Central hub connecting the main parts of Retro Plains.')\"><img src='Retro Plains Metro.png'></div>\
        <div class='rectangle' onclick=\"openLocation('Retro Plains Train Station.png','Retro Plains Train Station','Main station serving Retro Plains residents and visitors.')\"><img src='Retro Plains Train Station.png'></div>\
        </div>";
    } else if(tab==="railways"){
        content.innerHTML="<h2 class='retro-railways'>Retro Railways</h2><div class='rect-container'>\
        <div class='rectangle under-construction'></div>\
        <div class='rectangle under-construction'></div>\
        <div class='rectangle under-construction'></div>\
        <div class='rectangle under-construction'></div>\
        <div class='rectangle under-construction'></div>\
        <div class='rectangle under-construction'></div>\
        </div>";
    } else if(tab==="creators"){
        content.innerHTML="<h2>Creators</h2><div class='rect-container'>\
        <div class='rectangle' onclick=\"openLocation('fisnisse095.webp','Tragedy (@fisnisse09)','Creator of Retro Plains.')\"><img src='fisnisse09.webp' class='small-img'></div>\
        <div class='rectangle' onclick=\"openLocation('Prexii.webp','RobloxArvid','Co-Creator and Scripter.')\"><img src='RobloxArvid.webp' class='small-img'></div>\
        </div>";
    } else if(tab==="special"){
        content.innerHTML="<h2>Special People</h2><div class='rect-container'>\
        <div class='rectangle' onclick=\"openLocation('Lellesnygg.webp','Lellesnygg','CEO of Retro plains, Grandpa to fisnisse09. Respected and Kind hearted Person.')\"><img src='Lellesnygg.webp' class='small-img'></div>\
        </div>";
    }
}
showContent('home');

</script>

</body>
</html>
